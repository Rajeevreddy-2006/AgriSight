# Canonical label set shared by PlantVillage (lab photos) and PlantDoc (field photos).
# Folder names are matched after normalisation (lowercase, only a-z and 0-9),
# so small spelling/spacing differences between dataset versions still match.
# If prepare_data.py reports "unmapped" folders, add their names here.

